name: Deploy to Vercel
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: vercel-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Require Vercel configuration
        run: |
          test -n "$VERCEL_TOKEN" || { echo 'Configure VERCEL_TOKEN in repository secrets.'; exit 1; }
          test -n "$VERCEL_ORG_ID" || { echo 'Configure VERCEL_ORG_ID in repository secrets.'; exit 1; }
          test -n "$VERCEL_PROJECT_ID" || { echo 'Configure VERCEL_PROJECT_ID in repository secrets.'; exit 1; }
      - run: npm ci
      - run: npm test
      - name: Download production environment
        run: npx --yes vercel@65.2.0 pull --yes --environment=production --token="$VERCEL_TOKEN"
      - name: Validate production configuration
        run: NODE_ENV=production node --env-file=.vercel/.env.production.local --experimental-strip-types scripts/check-config.ts
      - name: Apply database schema
        run: NODE_ENV=production node --env-file=.vercel/.env.production.local --experimental-strip-types scripts/migrate.ts
      - name: Build production
        run: npx --yes vercel@65.2.0 build --prod --token="$VERCEL_TOKEN"
      - name: Deploy production
        run: |
          deployment_url=$(npx --yes vercel@65.2.0 deploy --prebuilt --prod --token="$VERCEL_TOKEN")
          echo "Deployment: $deployment_url" >> "$GITHUB_STEP_SUMMARY"
